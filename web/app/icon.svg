<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="agentmart-logo">
  <title id="agentmart-logo">AgentMart</title>
  <!-- One hexagon cut in two: the person's agent on one side, the shop's on the
       other, with a boundary between them that neither can reach across. The two
       bars are the only channel money crosses on, which is the whole product. -->
