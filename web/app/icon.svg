  <path d="M29 8.7 L10.3 19.5 L10.3 44.5 L29 55.3 Z" fill="#f7f7f2"/>
  <path d="M35 8.7 L53.7 19.5 L53.7 44.5 L35 55.3 Z" fill="#f7f7f2"/>
  <rect x="22" y="25.5" width="20" height="4" fill="#c9654a"/>
  <rect x="22" y="34.5" width="20" height="4" fill="#c9654a"/>
</svg>
