# Publishes four images to this repository's packages: one per service, and one that
# runs all three with only the dashboard exposed.
#
#   ghcr.io/<owner>/agentmart-market
#   ghcr.io/<owner>/agentmart-user
#   ghcr.io/<owner>/agentmart-web
#   ghcr.io/<owner>/aio_agentmart
#
# The gate runs first, for the same reason it runs before a release. Images are
# built for amd64 only: a Node build under emulation is slow enough to be worth
# adding on purpose rather than by default, and nothing is deployed to arm yet.

name: containers

# Tags only. Building four images on every push to main spent ten minutes of compute
# on commits that were often a documentation line, and an image nobody asked for is
# not worth the wait. A version is the event that wants images; anything else can ask
# for them by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  images:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agentmart-market
            file: deploy/Containerfile.market
            origin: "false"
          - image: agentmart-user
            file: deploy/Containerfile.user
            origin: "false"
          - image: agentmart-web
            file: deploy/Containerfile.web
            origin: "true"
          - image: aio_agentmart
            file: deploy/Containerfile.aio
            origin: "true"
    steps:
      - uses: actions/checkout@v5

      # The owner may be capitalised; a registry path may not be.
      - name: names
        id: names
        run: |
          set -eu
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "repo=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: tags
        id: tags
        run: |
          set -eu
          repo="${{ steps.names.outputs.repo }}"
          # Always the commit, so an image can be traced to source without a tag.
          tags="--tag ${repo}:sha-${GITHUB_SHA:0:12}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="$tags --tag ${repo}:${GITHUB_REF_NAME} --tag ${repo}:latest"
          else
            # Only a manual run reaches here, since a push no longer builds images.
            # It is named for the branch it was asked for rather than left as a bare
            # commit, so an unreleased build is recognisable.
            tags="$tags --tag ${repo}:${GITHUB_REF_NAME}"
          fi
          echo "args=$tags" >> "$GITHUB_OUTPUT"

      - name: login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Plain docker build: buildx and its cache backends would add moving parts for
      # a four image build that finishes in minutes without them.
      - name: build
        run: |
          set -eu
          # Only the two images that compile the dashboard declare this argument,
          # and passing it to the others would warn on every build.
          origin=""
          if [ "${{ matrix.origin }}" = "true" ]; then
            origin="--build-arg NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
          fi
          docker build \
            $origin \
            --file "${{ matrix.file }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            ${{ steps.tags.outputs.args }} \
            .
        env:
          # The dashboard's own origin is compiled into its bundle, so it is set
          # here rather than at run time. Override it in the repository variables
          # once the deployed origin is known.
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

      - name: push
        run: docker push --all-tags "${{ steps.names.outputs.repo }}"
