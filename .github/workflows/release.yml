# Publishes the two agent binaries for a tag. Both are static and depend on nothing
# at the far end: unpack and run with the environment the README names.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The gate runs first. A release built from a commit that did not pass it would be a
# claim nobody checked.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  binaries:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Three platforms: the machine this is deployed on, the machine it is
      # developed on, and a reviewer's laptop. Adding a target is one line.
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 windows/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            mkdir -p build
            for binary in market user; do
              name="$binary"
              [ "$os" = "windows" ] && name="$binary.exe"
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "build/$name" "./cmd/$binary"
            done
            archive="agentmart_${version}_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              (cd build && zip -q "../dist/${archive}.zip" market.exe user.exe)
            else
              tar -czf "dist/${archive}.tar.gz" -C build market user
            fi
            rm -rf build
          done
          # Only the archives, or the sums file ends up listing itself.
          (cd dist && sha256sum agentmart_* > SHA256SUMS)
          ls -l dist

      # gh is on the runner already, so this needs no third party action and no
      # token beyond the one the workflow is given. The notes go through a heredoc
      # rather than an inline argument: YAML strips the block's own indentation, so
      # what reaches Markdown is flush left and not a code fence.
      - name: notes
        run: |
          cat > dist/NOTES.md <<'NOTES'
          Merchant and buyer agents, built from this tag by the workflow that published it.

          Each archive holds both binaries, `market` and `user`. They read their
          configuration from the environment and `.env.example` lists every variable.
          The merchant will not start without Upstash Redis, which is deliberate: the
          session store is where a negotiation's state lives. The buyer needs the
          merchant's two endpoints, `USER_MARKET_MCP_ENDPOINT` and
          `USER_MARKET_A2A_ENDPOINT`.

          Container images for the same commit are published to this repository's
          packages, including an all-in-one image that runs all three services with
          only the dashboard exposed.

          Check a download against `SHA256SUMS` before running it.
          NOTES
          cat dist/NOTES.md

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" dist/agentmart_* dist/SHA256SUMS --clobber
          else
            gh release create "$version" dist/agentmart_* dist/SHA256SUMS \
              --title "$version" --notes-file dist/NOTES.md
          fi
